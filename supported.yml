  - model_name: grpc_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/grpcservers/{name}
    oas_schema: com.nokia.eda.management.v1.GRPCServer
  - model_name: http_server_list
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/httpservers
    oas_schema: com.nokia.eda.management.v1.HTTPServerList
  - model_name: http_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/httpservers/{name}
    oas_schema: com.nokia.eda.management.v1.HTTPServer
  - model_name: snmp_server_list
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/snmpservers
    oas_schema: com.nokia.eda.management.v1.SNMPServerList
  - model_name: snmp_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/snmpservers/{name}
    oas_schema: com.nokia.eda.management.v1.SNMPServer
  - model_name: snmp_server_state_list
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/snmpserverstates
    oas_schema: com.nokia.eda.management.v1.SNMPServerStateList
  - model_name: snmp_server_state
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/snmpserverstates/{name}
    oas_schema: com.nokia.eda.management.v1.SNMPServerState
  - model_name: ssh_server_list
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/sshservers
    oas_schema: com.nokia.eda.management.v1.SSHServerList
  - model_name: ssh_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/sshservers/{name}
    oas_schema: com.nokia.eda.management.v1.SSHServer

resources:
  - model_name: ftp_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/ftpservers
    oas_schema: com.nokia.eda.management.v1.FTPServer
  - model_name: grpc_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/grpcservers
    oas_schema: com.nokia.eda.management.v1.GRPCServer
  - model_name: http_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/httpservers
    oas_schema: com.nokia.eda.management.v1.HTTPServer
  - model_name: snmp_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/snmpservers
    oas_schema: com.nokia.eda.management.v1.SNMPServer
  - model_name: snmp_server_state
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/snmpserverstates
