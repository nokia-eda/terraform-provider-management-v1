qualified:
  datasources:
    - oas_schema: IntentTargets
      get: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/ftpservers/{name}/_targets
    - oas_schema: ResourceHistory
      get: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/ftpservers/{name}/_revs
    - oas_schema: UIResult
      get: /apps/management.eda.nokia.com/v1/_ui/{pathname}
    - oas_schema: com.nokia.eda.management.v1.FTPServer_DeletedResources
      get: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/ftpservers/_deleted
    - oas_schema: com.nokia.eda.management.v1.GRPCServer_DeletedResources
      get: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/grpcservers/_deleted
    - oas_schema: com.nokia.eda.management.v1.HTTPServer_DeletedResources
      get: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/httpservers/_deleted
    - oas_schema: com.nokia.eda.management.v1.SNMPServerState_DeletedResources
      get: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/snmpserverstates/_deleted
    - oas_schema: com.nokia.eda.management.v1.SNMPServer_DeletedResources
      get: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/snmpservers/_deleted
    - oas_schema: com.nokia.eda.management.v1.SSHServer_DeletedResources
      get: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/sshservers/_deleted
  resources:
