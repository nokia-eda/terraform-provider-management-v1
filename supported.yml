datasources:
  - model_name: app_group
    oas_endpoint: /apps/management.eda.nokia.com
    oas_schema: AppGroup
  - model_name: resource_list
    oas_endpoint: /apps/management.eda.nokia.com/v1
    oas_schema: ResourceList
  - model_name: ftp_server_list
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/ftpservers
    oas_schema: com.nokia.eda.management.v1.FTPServerList
  - model_name: ftp_server
    oas_endpoint: /apps/management.eda.nokia.com/v1/namespaces/{namespace}/ftpservers/{name}
    oas_schema: com.nokia.eda.management.v1.FTPServer
  - model_name: grpc_server_list
